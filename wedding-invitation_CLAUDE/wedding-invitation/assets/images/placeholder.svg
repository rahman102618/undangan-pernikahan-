<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Latar gradasi hangat sesuai palet Ivory, Sand, dan Champagne -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8CABB"/>
      <stop offset="1" stop-color="#AE9274"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- Siluet sederhana dua orang sebagai penanda posisi foto -->
  <circle cx="330" cy="400" r="70" fill="#F7F3ED" opacity="0.55"/>
  <path d="M190 760 C190 600 470 600 470 760 Z" fill="#F7F3ED" opacity="0.55"/>
  <circle cx="500" cy="380" r="70" fill="#F7F3ED" opacity="0.4"/>
  <path d="M360 760 C360 600 640 600 640 760 Z" fill="#F7F3ED" opacity="0.4"/>
  <!-- Teks petunjuk agar pengguna tahu ini foto sementara -->
  <text x="400" y="880" text-anchor="middle" font-family="serif" font-size="34" fill="#1C1B1A" opacity="0.7">Ganti dengan foto asli</text>
</svg>
